<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#496f59" />
    <meta name="description" content="atelier — deine Markdown-Wissenswerkstatt." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>atelier</title>
    <script>
      // Clean up registrations from older desktop releases even if the app bundle fails to load.
      if ('__TAURI_INTERNALS__' in window && 'serviceWorker' in navigator) {
        const workers = navigator.serviceWorker;
        workers.getRegistration().then(async registration => {
          if (registration?.active?.scriptURL !== new URL('/sw.js', location.href).href) return;
          const wasControlled = Boolean(workers.controller);
          if (await registration.unregister() && wasControlled) location.reload();
        }).catch(console.error);
      }
    </script>
    <script src="/firebase-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
