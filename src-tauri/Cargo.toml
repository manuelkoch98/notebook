[package]
name = "atelier"
version = "0.1.2"
description = "atelier personal Markdown knowledge workbench"
authors = ["Manuel Koch"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
jsonwebtoken = "9.3"
open = "5.3"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
